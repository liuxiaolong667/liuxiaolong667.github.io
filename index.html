<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>★ 古早味社交小站 ★</title>
    <!-- 引入 Supabase 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #008080;
            font-family: "SimSun", "宋体", serif;
            font-size: 12px;
            color: #000;
            margin: 20px auto;
            width: 780px;
        }
        .window {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 3px;
            margin-bottom: 10px;
        }
        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px 6px;
            font-weight: bold;
        }
        .window-body {
            padding: 10px;
            background: #ffffff;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            margin-top: 3px;
        }
        .layout { display: flex; gap: 10px; }
        sidebar { width: 240px; }
        main { flex: 1; }
        input, textarea, button {
            font-family: "SimSun", "宋体", serif;
            font-size: 12px;
            margin: 2px 0;
        }
        button {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 2px 8px;
            cursor: pointer;
        }
        button:active {
            border-color: #000000 #ffffff #ffffff #000000;
        }
        .post-item {
            border-bottom: 1px dashed #808080;
            padding: 8px 0;
        }
        .post-author { color: #000080; font-weight: bold; }
        .post-time { color: #808080; font-size: 11px; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">★ 古早味社交网络 - 欢迎大家注册入驻 ★</div>
</div>

<div class="layout">
    <!-- 左侧：用户登录/注册面板 -->
    <sidebar>
        <div class="window">
            <div class="title-bar">用户中心</div>
            <div class="window-body">
                <!-- 未登录状态 -->
                <div id="auth-box">
                    <p><b>[ 登录 / 注册 ]</b></p>
                    <label>邮箱：</label><br>
                    <input type="email" id="email" style="width:90%"><br>
                    <label>密码：</label><br>
                    <input type="password" id="password" style="width:90%"><br><br>
                    <button onclick="handleSignUp()">注册新账号</button>
                    <button onclick="handleLogin()">登录</button>
                </div>

                <!-- 已登录状态 -->
                <div id="user-box" style="display:none;">
                    <p>欢迎回来，<br><b id="user-email" class="post-author"></b>！</p>
                    <button onclick="handleLogout()">退出登录</button>
                </div>
            </div>
        </div>
    </sidebar>

    <!-- 右侧：发布与公共广场 -->
    <main>
        <!-- 发布框 -->
        <div class="window">
            <div class="title-bar">发表新动态</div>
            <div class="window-body">
                <textarea id="post-content" rows="3" style="width:98%" placeholder="写点什么吧，大家都能看到..."></textarea><br>
                <button onclick="handlePublish()">发布动态</button>
            </div>
        </div>

        <!-- 动态广场列表 -->
        <div class="window">
            <div class="title-bar">公共广场动态</div>
            <div class="window-body" id="posts-list">
                <p>正在加载公共广场动态...</p>
            </div>
        </div>
    </main>
</div>

<script>
    // ⚠️ 替换成你自己在 Supabase 拿到的 URL 和 KEY ⚠️
    const SUPABASE_URL = 'https://dspjvqladjtwcnogiuch.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7gWOS_PBaRe8vQbJF1FJTQ_i5ETsI9E';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 页面加载时检查登录状态并获取动态
    window.onload = async () => {
        checkUser();
        loadPosts();
    };

    // 检查登录状态
    async function checkUser() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (user) {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('user-box').style.display = 'block';
            document.getElementById('user-email').innerText = user.email;
        } else {
            document.getElementById('auth-box').style.display = 'block';
            document.getElementById('user-box').style.display = 'none';
        }
    }

    // 注册账号
    async function handleSignUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await _supabase.auth.signUp({ email, password });
        if (error) alert('注册失败: ' + error.message);
        else alert('注册成功！如果开启了邮箱验证，请去邮箱查收确认邮件。');
    }

    // 登录
    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert('登录失败: ' + error.message);
        else {
            alert('登录成功！');
            checkUser();
        }
    }

    // 退出
    async function handleLogout() {
        await _supabase.auth.signOut();
        checkUser();
    }

    // 发布动态（如果没有建表，先展示基本逻辑）
    async function handlePublish() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (!user) {
            alert('请先登录再发动态！');
            return;
        }
        const content = document.getElementById('post-content').value;
        if (!content) return alert('请输入内容！');

        // 提交数据到 Supabase 的 posts 表
        const { error } = await _supabase.from('posts').insert([
            { content: content, user_email: user.email }
        ]);

        if (error) {
            alert('发布失败（可能尚未在数据库创建 posts 表）: ' + error.message);
        } else {
            document.getElementById('post-content').value = '';
            loadPosts();
        }
    }

    // 加载广场动态
    async function loadPosts() {
        const { data: posts, error } = await _supabase
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false });

        const listDiv = document.getElementById('posts-list');
        if (error || !posts) {
            listDiv.innerHTML = '<p>暂时还没有动态，或者尚未建表。</p>';
            return;
        }

        listDiv.innerHTML = posts.map(p => `
            <div class="post-item">
                <span class="post-author">${p.user_email || '匿名用户'}</span>：
                <span>${p.content}</span>
            </div>
        `).join('');
    }
</script>

</body>
</html>
